name: Deploy WordPress plugin

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy tagged release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected an annotated X.Y.Z release tag; got: $tag" >&2
            exit 1
          fi
          plugin_version="$(sed -n 's/^ \* Version: //p' georg-kloster-bible-reader.php | head -n 1)"
          stable_tag="$(sed -n 's/^Stable tag: //p' readme.txt | head -n 1)"
          if [[ "$tag" != "$plugin_version" || "$tag" != "$stable_tag" ]]; then
            echo "Release version mismatch: tag=$tag plugin=$plugin_version stable-tag=$stable_tag" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Deploy to WordPress.org
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ vars.WORDPRESS_ORG_SLUG }}
        with:
          generate-zip: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.version }}
          files: ${{ steps.deploy.outputs.zip-path }}
          generate_release_notes: true
